# Builds the shop (Astro) and the design system (Storybook) and publishes both to GitHub Pages
# (and to Cloudflare Workers when the Cloudflare secrets are set, see the "cloudflare" job):
#   https://daniel-zec.github.io/voda-natura-webshop/            → shop (test, hidden from Google)
#   https://daniel-zec.github.io/voda-natura-webshop/storybook/  → design system
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://daniel-zec.github.io
      BASE_PATH: /voda-natura-webshop
      PUBLIC_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx astro check
      - name: Test stock import
        run: npm run test:stock
      - name: Build shop
        run: npm run build
      - name: Build design system (Storybook)
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /voda-natura-webshop/storybook/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Same site, built for the root path (/) and published to Cloudflare Workers.
  # Needs two repo secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  # Without them this job is skipped and only GitHub Pages is updated.
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://vodanatura.workers.dev' }}
      BASE_PATH: /
      PUBLIC_NOINDEX: 'true'
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set: skipping Cloudflare deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Build shop
        if: steps.gate.outputs.run == 'true'
        run: npm run build
      - name: Build design system (Storybook)
        if: steps.gate.outputs.run == 'true'
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /storybook/
      - name: Deploy to Cloudflare
        id: wrangler
        if: steps.gate.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Show Wrangler's error as an annotation on the run page, so it can be read without the full log.
      - name: Report Cloudflare error
        if: failure() && steps.wrangler.outcome == 'failure'
        env:
          ERR: ${{ steps.wrangler.outputs.command-stderr }}
          OUT: ${{ steps.wrangler.outputs.command-output }}
        run: |
          msg=$(printf '%s\n%s' "$ERR" "$OUT" | grep -v '^\s*$' | tail -25 | tr '\n' ' ' | cut -c1-3000)
          echo "::error title=Cloudflare deploy::$msg"
